appId: com.donattopieve.pluto
productName: Pluto
copyright: Copyright © 2026 Donatto Pieve

# Serve para os dois lados: `electron-builder --publish always` sobe os arquivos
# para cá, e o `latest.yml` empacotado junto diz ao app instalado onde procurar.
publish:
  provider: github
  owner: DonattoPieve
  repo: Finances
  # Sai publicado, não como rascunho: a tag já foi o gesto explícito de "esta é
  # uma versão". As notas podem ser escritas depois, editando o Release — o app
  # lê elas na próxima verificação.
  releaseType: release

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!.claude/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  - '!{.env,.env.*,.npmrc,.gitignore}'
  - '!*.md'
  - '!gerar-instalador.bat'
  - '!scripts/*'

asar: true

win:
  executableName: Pluto
  icon: build/icon.ico
  # Só o instalador. O portátil dobrava o tamanho de cada release (~115 MB a mais)
  # e o auto-update não usa: quem atualiza é o app instalado, pelo `latest.yml`.
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pluto
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
