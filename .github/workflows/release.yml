name: release

# Cria a versão nova quando você empurra uma tag `v1.2.3`.
#
# Por que tag e não todo push: build de instalador leva minutos e gera um
# arquivo de ~115 MB. Amarrar isso a cada commit encheria o Releases de lixo e
# faria o app instalado se atualizar para código pela metade. A tag é o gesto
# explícito de "esta é uma versão".
#
# A tag tem que combinar com o `version` do package.json — é esse número que o
# `latest.yml` publica e que o app instalado compara. Se estiverem diferentes, o
# passo de conferência abaixo quebra o build antes de publicar nada.
#
# Para lançar:  npm run lancar
# (confere, sobe a versão nos dois arquivos, cria a tag anotada e empurra.)

on:
  push:
    tags: ['v*']
  # Deixa disparar à mão pelo site do GitHub, para quando a tag já existe.
  workflow_dispatch:

jobs:
  windows:
    # SÓ em tag. Sem esta linha, um disparo manual em qualquer branch chegaria
    # ao `dist:publish`, que publica com `--publish always` — Release do nada.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      # O electron-builder usa o GITHUB_TOKEN para criar o Release e subir o .exe.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node 22: é o que o `node:sqlite` (usado pelo banco e pela bateria de
      # verificação) precisa, e é o que roda na máquina do Donatto.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: A tag combina com o package.json?
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME nao combina com a versao $pkg do package.json."
            echo "Use 'npm run lancar', que muda os dois de uma vez."
            exit 1
          fi

      - run: npm ci

      # A mesma bateria que roda na máquina dele: typecheck, 78 asserções de
      # lógica contra um SQLite real e 16 checagens estáticas de fiação.
      # Se falhar aqui, nada é publicado.
      - name: Verificação
        run: npm run verificar

      - name: Instalador e publicação
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A rede de segurança da publicação.
      #
      # O electron-builder subiu releases incompletos duas vezes seguidas: o
      # v0.2.2 ficou sem o `latest.yml` e o v0.3.0 ficou só com o `.blockmap`,
      # sem nem o instalador. O publisher dele cria o Release e envia os
      # arquivos em paralelo, e quando um envio falha o build ainda termina
      # verde — a falha só aparece para quem clica em "Buscar atualizações".
      #
      # Aqui os três arquivos são conferidos um a um e enviados com o `gh` se
      # estiverem faltando. São os do MESMO build: o `latest.yml` carrega o
      # sha512 do instalador, então um gerado noutra máquina passaria na
      # conferência e quebraria no download.
      - name: Conferir e completar os arquivos do Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          echo "O build gerou:"
          ls -la dist

          instalador=$(ls dist/pluto_*_setup.exe)
          blockmap="${instalador}.blockmap"
          for arquivo in "$instalador" "$blockmap" dist/latest.yml; do
            test -f "$arquivo" || { echo "O build nao gerou $arquivo."; exit 1; }
          done

          publicados() { gh release view "$tag" --json assets --jq '.assets[].name'; }

          for arquivo in "$instalador" "$blockmap" dist/latest.yml; do
            nome=$(basename "$arquivo")
            if publicados | grep -qx "$nome"; then
              echo "ok  $nome ja estava no Release"
            else
              echo "--  $nome faltando, enviando"
              gh release upload "$tag" "$arquivo" --clobber
            fi
          done

          echo "Arquivos no Release $tag:"
          publicados

          for arquivo in "$instalador" "$blockmap" dist/latest.yml; do
            nome=$(basename "$arquivo")
            publicados | grep -qx "$nome" || {
              echo "$nome continua ausente. A atualizacao automatica ficaria quebrada."
              exit 1
            }
          done
